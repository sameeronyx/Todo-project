<body class=" w-full bg-[#1f2329] p-6">

        </div>
        <div>

                <div class="">
                    <input id="todo-input" type="text"
                        class=" outline-0 rounded-md text-xl  border-[#1f2329] capatalize  border-2 px-3 py-2 "
                        placeholder="Enter your task">

                        class=" rounded-md bg-[#1f2329] text-[#b6ff2e] font-bold uppercase font-Athelas px-4 py-2 justify-center border border-lime-900 cursor-pointer ">Add</button>
            </form>

            <div class="flex justify-between py-3 text-xs border-b border-black ">
                <span id="task-count"
                    class="font-vanguard font-bold text-[#1f2329] text-sm  cursor-pointer">TASK(0)</span>
                <span id="complete-count"
                    class="font-vanguard font-bold text-[#1f2329] text-sm cursor pointer">COMPLETED(0)</span>
            </div>
